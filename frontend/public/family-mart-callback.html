<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家便利商店門市選擇完成</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #00A651, #00C766);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,166,81,0.2);
            max-width: 500px;
            width: 90%;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 40px;
            height: 40px;
            background: #00A651;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
        }
        .title {
            color: #00A651;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }
        .status {
            color: #666;
            margin: 20px 0;
            font-size: 16px;
        }
        .success {
            color: #00A651;
            font-weight: 600;
        }
        .store-info {
            background: #f0f9f4;
            border: 2px solid #00A651;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .store-name {
            font-size: 16px;
            font-weight: bold;
            color: #00A651;
            margin-bottom: 8px;
        }
        .store-detail {
            color: #333;
            margin: 4px 0;
            font-size: 14px;
        }
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">FM</div>
            <h1 class="title">全家便利商店</h1>
        </div>
        
        <p class="status" id="status">正在處理門市選擇資料...</p>
        
        <div class="debug" id="debug-info"></div>
        <div id="store-display"></div>
    </div>

    <script>
        console.log('🏪 全家便利商店 HTML 回調頁面載入');
        console.log('當前 URL:', window.location.href);
        
        // 解析 URL 參數
        const urlParams = new URLSearchParams(window.location.search);
        const allParams = {};
        for (const [key, value] of urlParams.entries()) {
            allParams[key] = value;
        }
        
        console.log('收到的 URL 參數:', allParams);
        
        // 顯示調試資訊
        const debugElement = document.getElementById('debug-info');
        const statusElement = document.getElementById('status');
        const storeDisplayElement = document.getElementById('store-display');
        
        debugElement.innerHTML = 
            '<strong>🔍 收到的 URL 參數:</strong>\n' + 
            JSON.stringify(allParams, null, 2) + '\n\n' +
            '<strong>完整 URL:</strong>\n' + window.location.href;

        // 解析門市資料 - 支援多種可能的參數格式
        let storeData = {
            storeId: 'unknown',
            storeName: '全家便利商店',
            storeAddress: '地址資訊不完整',
            storePhone: '請洽門市'
        };

        let hasValidStore = false;

        // 嘗試各種可能的參數名稱
        const possibleIds = ['pkey', 'storeId', 'CVSStoreID', 'id', 'store_id'];
        const possibleNames = ['storeName', 'CVSStoreName', 'name', 'store_name'];
        const possibleAddresses = ['address', 'storeAddress', 'CVSAddress', 'store_address'];
        const possiblePhones = ['phone', 'tel', 'storePhone', 'CVSTelephone', 'store_phone'];

        for (const key of possibleIds) {
            if (allParams[key]) {
                storeData.storeId = allParams[key];
                hasValidStore = true;
                break;
            }
        }

        for (const key of possibleNames) {
            if (allParams[key]) {
                storeData.storeName = allParams[key];
                break;
            }
        }

        for (const key of possibleAddresses) {
            if (allParams[key]) {
                storeData.storeAddress = allParams[key];
                break;
            }
        }

        for (const key of possiblePhones) {
            if (allParams[key]) {
                storeData.storePhone = allParams[key];
                break;
            }
        }

        // 如果有地區資訊，組合地址
        if (allParams.city && allParams.area) {
            const cityArea = allParams.city + allParams.area;
            if (!storeData.storeAddress.includes(cityArea)) {
                storeData.storeAddress = cityArea + storeData.storeAddress;
            }
        }

        console.log('解析後的門市資料:', storeData);
        console.log('是否有有效門市資料:', hasValidStore);

        if (hasValidStore) {
            statusElement.innerHTML = '<span class="success">✅ 門市選擇成功！</span>';
            
            // 顯示選擇的門市資訊
            storeDisplayElement.innerHTML = `
              <div class="store-info">
                <div class="store-name">📍 ${storeData.storeName}</div>
                <div class="store-detail"><strong>門市代碼:</strong> ${storeData.storeId}</div>
                <div class="store-detail"><strong>地址:</strong> ${storeData.storeAddress}</div>
                ${storeData.storePhone && storeData.storePhone !== '請洽門市' ? 
                  `<div class="store-detail"><strong>電話:</strong> ${storeData.storePhone}</div>` : ''
                }
              </div>
            `;

            // 通知父視窗門市選擇完成
            if (window.opener) {
                console.log('向父視窗發送門市選擇訊息');
                window.opener.postMessage({
                    type: 'STORE_SELECTED',
                    store: {
                        storeId: storeData.storeId,
                        storeName: storeData.storeName,
                        storeAddress: storeData.storeAddress,
                        storePhone: storeData.storePhone
                    },
                    originalParams: allParams,
                    source: 'family-mart-html'
                }, '*');
                
                setTimeout(() => {
                    statusElement.innerHTML = '<span class="success">✅ 門市選擇完成，正在關閉視窗...</span>';
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                }, 1000);
            } else if (window.parent && window.parent !== window) {
                // 如果是在 iframe 中
                console.log('向父 iframe 發送門市選擇訊息');
                window.parent.postMessage({
                    type: 'STORE_SELECTED',
                    store: {
                        storeId: storeData.storeId,
                        storeName: storeData.storeName,
                        storeAddress: storeData.storeAddress,
                        storePhone: storeData.storePhone
                    },
                    originalParams: allParams,
                    source: 'family-mart-html-iframe'
                }, '*');
            } else {
                statusElement.innerHTML = '⚠️ 獨立視窗，請手動關閉此頁面';
            }
        } else {
            statusElement.innerHTML = '❌ 沒有收到有效的門市選擇資料';
            debugElement.innerHTML += '\n\n<strong>❌ 錯誤:</strong>無法解析門市資料\n可能的原因：\n1. 全家 API 參數格式變更\n2. 回調機制異常\n3. URL 參數遺失';
        }
        
        // 如果沒有任何參數，可能是直接訪問
        if (Object.keys(allParams).length === 0) {
            statusElement.innerHTML = '⚠️ 沒有收到任何參數，可能是直接訪問此頁面';
            debugElement.innerHTML += '\n\n<strong>ℹ️ 提示:</strong>此頁面應該由全家便利商店 API 回調訪問';
        }
    </script>
</body>
</html>
