<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家便利商店門市選擇 - 手動確認</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #00A651, #00C766);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,166,81,0.2);
            max-width: 600px;
            width: 90%;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 40px;
            height: 40px;
            background: #00A651;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
        }
        .title {
            color: #00A651;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .instruction {
            background: #e8f5e8;
            border: 2px solid #00A651;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .step {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #00A651;
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00A651;
        }
        .btn {
            background: #00A651;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #008a44;
            transform: translateY(-1px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .success-msg {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        .url-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">FM</div>
            <h1 class="title">全家便利商店門市選擇</h1>
        </div>
        
        <div class="instruction">
            <h3 style="color: #00A651; margin-top: 0;">📋 門市選擇步驟</h3>
            <div class="step">
                <strong>步驟 1:</strong> 在全家門市地圖中選擇您要的門市
            </div>
            <div class="step">
                <strong>步驟 2:</strong> 當頁面顯示「無來源網頁資料」時，請查看網址列
            </div>
            <div class="step">
                <strong>步驟 3:</strong> 從網址中找到門市代碼 (pkey=xxxxxx)
            </div>
            <div class="step">
                <strong>步驟 4:</strong> 將門市代碼填入下方欄位並確認
            </div>
        </div>

        <form id="storeForm">
            <div class="input-group">
                <label for="storeId">門市代碼 (從網址的 pkey= 後面複製):</label>
                <input type="text" id="storeId" placeholder="例如: 020390" required>
            </div>
            <div class="input-group">
                <label for="storeName">門市名稱 (選填):</label>
                <input type="text" id="storeName" placeholder="例如: 四湖門市">
            </div>
            <div class="input-group">
                <label for="storeAddress">門市地址 (選填):</label>
                <input type="text" id="storeAddress" placeholder="例如: 雲林縣四湖鄉...">
            </div>
            
            <button type="submit" class="btn">確認門市選擇</button>
            <button type="button" class="btn" onclick="autoFillFromUrl()">從目前網址自動填入</button>
        </form>

        <div class="success-msg" id="successMsg">
            ✅ 門市選擇成功！正在關閉視窗...
        </div>

        <div class="url-info" id="urlInfo" style="display: none;">
            <strong>目前網址:</strong><br>
            <span id="currentUrl"></span>
        </div>
    </div>

    <script>
        console.log('🏪 全家便利商店手動門市選擇頁面');
        
        // 顯示目前網址
        document.getElementById('currentUrl').textContent = window.location.href;
        
        // 自動從網址填入資訊
        function autoFillFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            
            const storeId = urlParams.get('pkey') || '';
            const city = urlParams.get('city') || '';
            const area = urlParams.get('area') || '';
            
            if (storeId) {
                document.getElementById('storeId').value = storeId;
            }
            
            if (city && area) {
                const decodedCity = decodeURIComponent(city);
                const decodedArea = decodeURIComponent(area);
                document.getElementById('storeAddress').value = decodedCity + decodedArea;
            }
            
            // 顯示 URL 資訊供參考
            document.getElementById('urlInfo').style.display = 'block';
            
            if (storeId) {
                alert('已自動填入門市代碼: ' + storeId);
            } else {
                alert('未能從網址中找到門市代碼，請手動輸入');
            }
        }
        
        // 檢查是否已經在 retrieve.aspx 頁面
        if (window.location.href.includes('retrieve.aspx')) {
            // 如果在 retrieve 頁面，自動嘗試填入
            setTimeout(autoFillFromUrl, 500);
        }
        
        // 處理表單提交
        document.getElementById('storeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const storeId = document.getElementById('storeId').value.trim();
            const storeName = document.getElementById('storeName').value.trim() || '全家便利商店';
            const storeAddress = document.getElementById('storeAddress').value.trim() || '地址資訊不完整';
            
            if (!storeId) {
                alert('請輸入門市代碼');
                return;
            }
            
            const storeData = {
                storeId: storeId,
                storeName: storeName,
                storeAddress: storeAddress,
                storePhone: '請洽門市'
            };
            
            console.log('確認選擇門市:', storeData);
            
            // 通知父視窗
            if (window.opener) {
                console.log('向父視窗發送門市選擇訊息');
                window.opener.postMessage({
                    type: 'STORE_SELECTED',
                    store: storeData,
                    source: 'family-mart-manual'
                }, '*');
                
                // 顯示成功訊息
                document.getElementById('successMsg').style.display = 'block';
                
                setTimeout(() => {
                    window.close();
                }, 2000);
            } else {
                alert('門市選擇完成！\\n門市代碼: ' + storeId + '\\n門市名稱: ' + storeName);
            }
        });
        
        // 監聽鍵盤事件，Enter 鍵提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('storeForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
